<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaSwift — Language Translator</title>
  <!--
    In Flask, CSS and JS files go inside a folder called "static/"
    Flask uses url_for('static', filename='style.css') to link them.
    But for simplicity here, we'll write the CSS inline.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #eef2ff;
      --text-dark: #1e1b4b;
      --text-muted: #6b7280;
      --bg: #f5f7ff;
      --white: #ffffff;
      --border: #e0e7ff;
      --error: #ef4444;
      --radius: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { width: 100%; text-align: center; padding: 40px 20px 20px; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .logo-icon { font-size: 32px; }
    .logo-text { font-size: 28px; font-weight: 700; color: var(--primary); }
    .tagline { color: var(--text-muted); font-size: 15px; }
    .backend-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      background: #dcfce7;
      color: #166534;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .container {
      width: 100%;
      max-width: 900px;
      padding: 32px;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(79,70,229,.10);
      margin: 10px 20px 40px;
    }
    .lang-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .lang-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .lang-group label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
    .lang-group select {
      appearance: none; width: 100%; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: 10px;
      font-size: 15px; font-weight: 500; color: var(--text-dark);
      background: var(--white); cursor: pointer; transition: border-color .2s;
    }
    .lang-group select:focus { outline: none; border-color: var(--primary); }
    .swap-btn {
      width: 48px; height: 48px; border: 2px solid var(--border);
      border-radius: 50%; background: var(--white); font-size: 20px;
      cursor: pointer; transition: all .2s; flex-shrink: 0; margin-top: 22px;
    }
    .swap-btn:hover { background: var(--primary-light); border-color: var(--primary); transform: rotate(180deg); }
    .text-area-row { display: flex; gap: 16px; margin-bottom: 20px; }
    .text-box { flex: 1; border: 2px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .box-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--primary-light); border-bottom: 1px solid var(--border); }
    .box-label { font-size: 13px; font-weight: 600; color: var(--primary); }
    .char-count { font-size: 12px; color: var(--text-muted); }
    .output-actions { display: flex; gap: 8px; }
    textarea { width: 100%; height: 200px; padding: 16px; border: none; resize: vertical; font-family: inherit; font-size: 15px; line-height: 1.6; color: var(--text-dark); outline: none; }
    textarea::placeholder { color: #c4c8d8; }
    .box-footer { padding: 8px 12px; display: flex; justify-content: flex-end; border-top: 1px solid var(--border); }
    .output-text { flex: 1; padding: 16px; font-size: 15px; line-height: 1.7; min-height: 200px; background: #fafbff; }
    .output-box { background: #fafbff; }
    .placeholder-hint { color: #c4c8d8; font-style: italic; }
    .icon-btn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--white); font-size: 12px; cursor: pointer; transition: all .15s; color: var(--text-muted); }
    .icon-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .clear-btn { font-size: 12px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 4px 8px; }
    .translate-btn { width: 100%; padding: 16px; background: var(--primary); color: var(--white); border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .translate-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .translate-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .loader { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--primary); font-size: 14px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .error-msg { margin-top: 14px; padding: 12px 16px; background: #fff5f5; border: 1px solid #fecaca; border-radius: 8px; color: var(--error); font-size: 14px; }
    .footer { padding: 16px; color: var(--text-muted); font-size: 13px; text-align: center; }
    @media (max-width: 640px) {
      .container { padding: 20px; margin: 10px; }
      .text-area-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">
      <span class="logo-icon">🌐</span>
      <span class="logo-text">LinguaSwift</span>
    </div>
    <p class="tagline">Translate instantly between 10+ languages</p>
    <span class="backend-badge">✅ Powered by Flask Backend</span>
    <!--
      This badge shows that requests go through YOUR Python server now,
      not directly from the browser to the API.
    -->
  </header>

  <main class="container">

    <div class="lang-bar">
      <div class="lang-group">
        <label for="sourceLang">From</label>
        <select id="sourceLang">
          <option value="en">English</option>
          <option value="ur">Urdu</option>
          <option value="ar">Arabic</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="hi">Hindi</option>
          <option value="tr">Turkish</option>
          <option value="ru">Russian</option>
        </select>
      </div>

      <button class="swap-btn" onclick="swapLanguages()">⇄</button>

      <div class="lang-group">
        <label for="targetLang">To</label>
        <select id="targetLang">
          <option value="ur">Urdu</option>
          <option value="en">English</option>
          <option value="ar">Arabic</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="zh">Chinese</option>
          <option value="hi">Hindi</option>
          <option value="tr">Turkish</option>
          <option value="ru">Russian</option>
        </select>
      </div>
    </div>

    <div class="text-area-row">
      <div class="text-box">
        <div class="box-header">
          <span class="box-label">Your text</span>
          <span class="char-count" id="charCount">0 / 500</span>
        </div>
        <textarea id="inputText" placeholder="Type or paste text here..." maxlength="500" oninput="updateCharCount()"></textarea>
        <div class="box-footer">
          <button class="clear-btn" onclick="clearAll()">✕ Clear</button>
        </div>
      </div>

      <div class="text-box output-box">
        <div class="box-header">
          <span class="box-label">Translation</span>
          <div class="output-actions">
            <button class="icon-btn" onclick="copyText()">📋 Copy</button>
            <button class="icon-btn" onclick="speakText()">🔊 Speak</button>
          </div>
        </div>
        <div id="outputText" class="output-text">
          <span class="placeholder-hint">Translation will appear here...</span>
        </div>
        <div id="loader" class="loader hidden">
          <div class="spinner"></div>
          <span>Translating via Flask server...</span>
          <!--
            Notice this says "via Flask server" now —
            the request goes to YOUR Python app first.
          -->
        </div>
      </div>
    </div>

    <button class="translate-btn" id="translateBtn" onclick="translateText()">
      Translate →
    </button>

    <div id="errorMsg" class="error-msg hidden"></div>

  </main>

  <footer class="footer">
    <p>LinguaSwift · Flask Backend + MyMemory API · Built by Eman · 2025</p>
  </footer>

  <script>
    // ============================================================
    // UPDATED JAVASCRIPT — Now talks to YOUR Flask server
    // instead of directly to MyMemory API
    //
    // BEFORE (direct): Browser → MyMemory API
    // NOW (with backend): Browser → Flask Server → MyMemory API
    // ============================================================

    function updateCharCount() {
      const input = document.getElementById("inputText");
      document.getElementById("charCount").textContent = `${input.value.length} / 500`;
    }

    function swapLanguages() {
      const s = document.getElementById("sourceLang");
      const t = document.getElementById("targetLang");
      const temp = s.value;
      s.value = t.value;
      t.value = temp;
    }

    function clearAll() {
      document.getElementById("inputText").value = "";
      document.getElementById("outputText").innerHTML = '<span class="placeholder-hint">Translation will appear here...</span>';
      document.getElementById("charCount").textContent = "0 / 500";
      document.getElementById("errorMsg").classList.add("hidden");
    }

    function copyText() {
      const text = document.getElementById("outputText").innerText;
      if (!text || text === "Translation will appear here...") return alert("Nothing to copy!");
      navigator.clipboard.writeText(text).then(() => alert("Copied!"));
    }

    function speakText() {
      const text = document.getElementById("outputText").innerText;
      if (!text || text === "Translation will appear here...") return alert("Nothing to speak!");
      const u = new SpeechSynthesisUtterance(text);
      u.lang = document.getElementById("targetLang").value;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    // ---- THE KEY CHANGE: We now POST to /translate on OUR server ----
    async function translateText() {
      const text = document.getElementById("inputText").value.trim();
      const source = document.getElementById("sourceLang").value;
      const target = document.getElementById("targetLang").value;

      if (!text) return showError("Please enter some text first.");
      if (source === target) return showError("Source and target must be different.");

      showLoader(true);
      document.getElementById("errorMsg").classList.add("hidden");
      document.getElementById("outputText").innerHTML = "";
      document.getElementById("translateBtn").disabled = true;

      try {
        // =====================================================
        // THIS IS THE BIG DIFFERENCE FROM BEFORE:
        //
        // BEFORE: fetch("https://api.mymemory.translated.net/get?q=...")
        // NOW:    fetch("/translate") ← YOUR own Flask server
        //
        // We send a POST request with JSON body.
        // Flask reads it, calls MyMemory, and sends back the result.
        // =====================================================

        const response = await fetch("/translate", {
          method: "POST",
          // POST because we are SENDING data (not just requesting a page)

          headers: {
            "Content-Type": "application/json"
            // This tells the server: "I'm sending JSON data"
          },

          body: JSON.stringify({
            text: text,
            source: source,
            target: target
          })
          // JSON.stringify() converts JS object → JSON string
          // { text: "Hello", source: "en", target: "ur" }
          // → '{"text":"Hello","source":"en","target":"ur"}'
        });

        const data = await response.json();
        // data is now a Python dict that Flask returned, converted to JS object

        if (data.success) {
          document.getElementById("outputText").textContent = data.translation;
        } else {
          showError(data.error || "Translation failed.");
        }

      } catch (error) {
        console.error(error);
        showError("Could not connect to server. Make sure Flask is running.");
      } finally {
        showLoader(false);
        document.getElementById("translateBtn").disabled = false;
      }
    }

    function showLoader(on) {
      document.getElementById("loader").classList.toggle("hidden", !on);
    }

    function showError(msg) {
      const e = document.getElementById("errorMsg");
      e.textContent = "⚠️ " + msg;
      e.classList.remove("hidden");
    }

    document.addEventListener("keydown", e => {
      if (e.ctrlKey && e.key === "Enter") translateText();
    });
  </script>

</body>
</html>
